<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <meta content="noindex,nofollow" name="robots"/>
    <meta content="noindex,nofollow" name="googlebot"/>
    <title>SHEQ Aid - Password Recovery</title>

    <!-- update the version number as needed -->
    <!--        <script defer src="/__/firebase/7.15.4/firebase-app.js"></script>
            <script defer src="/__/firebase/7.15.4/firebase-functions.js"></script>
            <script defer src="/__/firebase/init.js"></script>-->
    <script src="/js/lib/firebase-8.0.2/app.js"></script>
    <script src="/js/lib/firebase-8.0.2/auth.js"></script>
    <script src="/js/lib/firebase-8.0.2/functions.js"></script>
    <!--<script src="/js/lib/firebase-9.2.0/app-check.js"></script>-->

    <script src="/js/web-workers/firebase_client_app.js"></script>

    <link href="./style.css" media="all" rel="stylesheet"/>
</head>
<body>
<div id="message">
    <h3><b>Recover Password</b></h3>
    <hr/>
    <p>Please use the form below to reset your Password.</p>
    <p>
        <label>New Password</label>
        <input name="password" placeholder="New Password" type="password"/>
        <label>Confirmation Password</label>
        <input name="password_conf" placeholder="Confirmation Password" type="password"/>
    </p>
    <p>
        <a class="button" href="javascript:submit();">Submit</a>
    </p>
    <p id="msg"></p>
</div>
<div id="no-access">
    <h3><b>This page is forbidden</b></h3>
</div>
<p id="footer">&copy;<span></span> SHEQ Aid. All Rights Reserved</p>

<script>
    function getParam(name) {
        var parser = document.createElement('a');
        parser.href = window.location.href;
        var query = parser.search.substring(1);
        var vars = query.split('&');
        for (var i = 0; i < vars.length; i++) {
            var pair = vars[i].split('=');
            if (pair[0] === name && pair[1]) {
                return decodeURIComponent(pair[1]);
            }
        }
    }

    const firebase_fn = getParam('type') === 'contractor' ? window.functions2 : window.functions;

    function submit() {
        var password = document.querySelector('input[name=password]');
        if (password.value.trim().length === 0) {
            alert('New Password is required')
            return;
        }
        if (password.value.trim().length < 6) {
            alert('New Password must be a minimum of 6 characters')
            return;
        }

        var password_conf = document.querySelector('input[name=password_conf]');
        if (password_conf.value.trim().length === 0) {
            alert('Confirmation Password is required')
            return;
        }

        if (password.value !== password_conf.value) {
            alert('New Password and Confirmation Password do not match')
            return;
        }

        var btn = document.querySelector('.button');
        btn.setAttribute("disabled", true);
        var msg = document.querySelector('#msg');

        msg.innerHTML = 'Please wait...';

        //https://server.cloud.sheqaid.com/api/callables/
        fetch(`https://server.cloud.sheqaid.com/api/callables/accounts/onResetPassword/${getParam('type')}`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                id: getParam('id'),
                password: password.value
            }),
        }).then(res => res.json()).then(res => {
            console.log('res', res)
            if (!res) {
                msg.innerHTML = 'You are not authorized to update the password.';
                return;
            }
            res = res.data;
            if (!res) {
                msg.innerHTML = 'You are not authorized to update the password.';
                return;
            }
            if (res === true) {
                password.value = '';
                password_conf.value = '';
                msg.innerHTML = 'Password successfully reset.<br />Please login to the system using your new password.';
            } else if (res === "UDATE_ERROR") {
                msg.innerHTML = 'The password could not be updated. Please try again.<br /><br />\n\
                                                Note: <i style="color: red;">If you recently updated your password, please request another <b>Password Recovery</b></i>';
            } else if (res === "TOKEN_NOT_FOUND") {
                msg.innerHTML = 'The password could not be updated. Please try again.';
            } else {
                msg.innerHTML = 'You are not authorized to update the password.';
            }
        }).catch(e => {
            if (e.code === 'not-found') {
                msg.innerHTML = 'The user to reset password for does not exist.';
            } else {
                msg.innerHTML = 'An error occurred. Please try again.';
                console.error(e);
            }
        }).finally(() => {
            btn.setAttribute("disabled", false);

        });
    }

    document.addEventListener('DOMContentLoaded', function () {
        document.querySelector('#footer span').innerHTML = new Date().getFullYear();

        var message = document.querySelector('#message');
        var no_access = document.querySelector('#no-access');
        if (getParam('id') && getParam('type')) {
            message.style.display = "block";
            no_access.style.display = "none";
        } else {
            message.style.display = "none";
            no_access.style.display = "block";
        }
    });
</script>
</body>
</html>
